# ============================================================================
# dsh-usage-meter — 模型 token 用量统计（不计费）
# ============================================================================
# 本插件只做一件事：把每次模型调用上报的 token 用量，按
# 渠道(provider) × 模型 × 日期 记到本地账本里，并提供设置页与 usage_stats 工具。
#
# 它不写任何价格、金额、余额字段，也不改动 llm / provider 配置。
# 卸载本层时下面的 insert 行会随之回滚，账本文件仍留在磁盘上（不会被删）。
# ============================================================================

- insert:
    - id: usage-meter
      name: dsh-usage-meter
      config:
        # 采集总开关。false 时插件仍加载，但不记账、工具与页面返回已有历史。
        enabled: true
        # 账本目录。留空则用 $DSH_HOME/usage-meter。
        # dir: C:\Users\<you>\.dsh\usage-meter
        # 同一渠道/模型/用途/会话且 token 数完全相同的调用，在此窗口内重复上报
        # （重试或重放）只记一次。设 0 完全关闭合并。
        dedupWindowMs: 2000
        # 不记账的用途。空数组 = 全部记录（main / compaction / session-title …）。
        excludePurposes: []
        # 设置页「原始明细」单次最多返回多少行，10-2000。
        maxDetailRows: 200
        # 首次加载时一次性折叠持久会话日志，把插件存在之前的用量补进账本。
        # 跑过一次就写 backfill.json，不会再跑。本组合没有 sessionQuery 服务时自动跳过。
        backfill: true
        # 回填一次最多读多少个会话，防止会话库极大时把内存吃满。
        backfillMaxSessions: 2000